name: CI

on:
  push:
    branches: [main, 'feat/*', 'chore/*', 'fix/*', 'test/*']
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server Checks & Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint server
        run: npm run lint --prefix server

      - name: Run server tests
        run: npm test --prefix server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/vidstream_test
          JWT_ACCESS_SECRET: test_access_token_secret_for_jwt_32_characters_minimum
          JWT_REFRESH_SECRET: test_refresh_token_secret_for_jwt_32_characters_minimum
          CLOUDINARY_API_KEY: mock_key
          CLOUDINARY_API_SECRET: mock_secret
          CLOUDINARY_CLOUD_NAME: mock_cloud

  client:
    name: Client Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint client
        run: npm run lint --prefix client

      - name: Build client
        run: npm run build --prefix client
